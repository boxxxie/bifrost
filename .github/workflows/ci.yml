name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Odin compiler
        uses: laytan/setup-odin@v2
        with:
          release: latest
          token: ${{ secrets.GITHUB_TOKEN }}
          cache: false

      - name: Verify AST ATDD Codegen & Layer 1 Scenario Purity
        run: |
          odin run tools/bifrost_gen -- --atdd tests
          git diff --ignore-space-at-eol --exit-code tests/dsl_atdd_gen.odin

      - name: Run Bifrost Unit Test Suite (with Tracking Allocator)
        run: odin test bifrost -vet -strict-style -vet-packages:bifrost

      - name: Run AST Codegen Test Suite (with Tracking Allocator)
        run: odin test bifrost/codegen -vet -strict-style

      - name: Run ATDD Executable Specification Suite
        run: odin test tests -custom-attribute:scenario -vet -strict-style -vet-packages:bifrost,bifrost_tests

      - name: Verify Headless Example 1 (Widget Gallery)
        run: odin run examples/widget_gallery -custom-attribute:ui_actions,ui_action,ui_scope -vet -strict-style -vet-packages:bifrost -- --headless

      - name: Verify Headless Example 2 (Kanban Board)
        run: odin run examples/kanban_board -custom-attribute:ui_actions,ui_action,ui_scope -vet -strict-style -vet-packages:bifrost -- --headless

      - name: Verify Headless Example 3 (Log Monitor)
        run: odin run examples/log_monitor -custom-attribute:ui_actions,ui_action,ui_scope -vet -strict-style -vet-packages:bifrost -- --headless

      - name: Verify Headless Example 4 (xitdb Inspector)
        run: odin run examples/xitdb_inspector -custom-attribute:ui_actions,ui_action,ui_scope -vet -strict-style -vet-packages:bifrost -- --headless

      - name: Verify Headless Example 5 (Keymap Workbench)
        run: odin run examples/keymap_workbench -custom-attribute:ui_actions,ui_action,ui_scope -vet -strict-style -vet-packages:bifrost -- --headless
